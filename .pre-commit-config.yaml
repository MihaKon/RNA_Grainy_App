exclude: ^(app/static/presets|tests/data)/.*\.(cif|pdb)$
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]

      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]

      - id: end-of-file-fixer
        stages: [pre-commit]

      - id: check-merge-conflict
        stages: [pre-commit]

      - id: detect-private-key
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]

      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mypy
        name: Run mypy
        entry: pipenv run mypy
        language: system
        pass_filenames: false
        files: '^((app|tests)/.*\.py|pyproject\.toml|Pipfile(\.lock)?)$'
        stages: [pre-commit]

      - id: pytest
        name: Run unit and integration tests
        entry: pipenv run pytest tests/unit tests/integration
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-format
        name: Check frontend formatting
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-commit]

      - id: frontend-lint
        name: Lint frontend
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js)$
        stages: [pre-commit]

      - id: frontend-typecheck
        name: Typecheck frontend
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|json)$
        stages: [pre-commit]

      - id: frontend-test
        name: Run frontend tests
        entry: npm --prefix frontend test
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]
