<!-- TODO: create custom model option -->

{% macro select_field(model, options_var, label, on_change="") %}
<div class="space-y-1" 
  x-data="{ 
     open: false, 
     selectedLabel: '',
     init() {
      const initial = {{ options_var }}.find(o => o.value === {{ model }});
      this.selectedLabel = initial ? initial.label : 'Select...';
      
      this.$watch('{{ model }}', (val) => {
       const found = {{ options_var }}.find(o => o.value === val);
       this.selectedLabel = found ? found.label : 'Select...';
      });
     }
  }">
    
    {% if label %}
    <label class="text-xs font-semibold text-primary uppercase">{{ label }}</label>
    {% endif %}

    <div class="relative" @click.outside="open = false">
     <input type="hidden" name="{{ model.split('.')[-1] }}" x-model="{{ model }}">

     <button type="button" 
       @click="open = !open"
       class="w-full bg-white border border-primary/20 rounded-xl py-2.5 px-4 text-sm shadow-sm outline-none transition-all flex justify-between items-center cursor-pointer focus:border-accent focus:ring-2 focus:ring-focus"
       :class="open ? 'border-accent ring-2 ring-focus' : ''">
      
      <span class="truncate" 
         :class="{{ model }} ? 'text-secondary font-semibold' : 'text-primary/40'"
         x-text="selectedLabel"></span>

      <i class="fa-solid fa-chevron-down text-xs text-primary/40 transition-transform duration-200 ml-auto" 
      :class="{ 'rotate-180': open }"></i>
     </button>

     <div x-show="open" 
       class="absolute z-50 left-0 right-0 mt-2 bg-white shadow-xl rounded-xl py-1 border border-primary/10 overflow-hidden max-h-60 overflow-y-auto">
      
      <template x-for="option in {{ options_var }}" :key="option.value">
       <div @click="{{ model }} = option.value; 
             selectedLabel = option.label; 
             open = false; 
             {{ on_change }}"
         class="cursor-pointer select-none relative py-2.5 px-4 text-sm transition-colors hover:bg-accent-light flex items-center justify-between group font-medium text-primary hover:text-accent"
         >
        
        <span x-text="option.label"></span>

        <i x-show="{{ model }} === option.value" class="fa-solid fa-check text-[10px] text-accent"></i>
       </div>
      </template>
     </div>
    </div>
</div>
{% endmacro %}
