<div class="flex items-start gap-4 p-4 rounded-xl bg-danger-light border border-danger/10 shadow-sm" role="alert">
    <div class="shrink-0 text-danger">
        <i class="fa-solid fa-circle-exclamation fa-lg mt-0.5"></i>
    </div>

    <div class="flex flex-col gap-1 min-w-0">
        <h3 class="text-sm font-bold text-primary">
            Upload Failed
        </h3>
        <p class="text-sm text-secondary break-words leading-relaxed">
            {{ error }}
        </p>
    </div>
</div>
