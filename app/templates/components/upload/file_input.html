<div class="space-y-2">
    <div class="relative group">
        <input type="file" id="file" name="file" x-ref="fileInput" @change="handleFileSelect"
            accept="{% for file_format in supported_file_formats %}{{ '.'~file_format~',' }}{% endfor %}"
            class="hidden" />

        <label x-show="!file" for="file"
            class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-xl cursor-pointer transition-all duration-200 bg-gray-50/50 group-hover:bg-accent/5"
            :class="errors.file ? 'border-danger bg-danger-light/20' : 'border-primary/20 hover:border-accent'">
            <div
                class="flex flex-col items-center justify-center pt-5 pb-6 text-primary/60 group-hover:text-accent transition-colors">
                <i class="fa-solid fa-cloud-arrow-up text-2xl mb-2"></i>
                <p class="text-sm">
                    <span class="font-semibold">Click to upload</span>
                </p>
            </div>
        </label>

        <div x-show="file" x-cloak
            class="flex items-center justify-between w-full p-3 border rounded-xl bg-accent/5 border-accent/20">
            <div class="flex items-center gap-3 overflow-hidden">
                <div
                    class="w-8 h-8 rounded-lg bg-accent text-white flex items-center justify-center shrink-0 shadow-sm shadow-accent/20">
                    <i class="fa-solid fa-file"></i>
                </div>
                <div class="flex flex-col min-w-0">
                    <span class="text-sm font-bold text-secondary truncate" x-text="file?.name"></span>
                    <span class="text-xs text-primary/70" x-text="(file?.size / 1024).toFixed(1) + ' KB'"></span>
                </div>
            </div>
            <button type="button" @click="removeFile"
                class="p-2 text-primary/40 hover:text-danger transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-primary/10"></div>
        <span class="flex-shrink-0 mx-4 text-primary/40 text-xs font-bold uppercase tracking-wider">OR USE PDB ID</span>
        <div class="flex-grow border-t border-primary/10"></div>
    </div>

    <div>
        <div class="relative text-primary">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-primary/40">
                <i class="fa-solid fa-dna"></i>
            </div>
            <input type="text" name="rcsb_id" x-model="rcsbId" @input="handleRcsbInput"
                placeholder="Enter PDB ID (e.g. 1RNA)"
                class="block w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border bg-white shadow-sm outline-none transition-all placeholder:text-primary/30"
                :class="errors.file 
                               ? 'border-danger focus:border-danger focus:ring-2 focus:ring-danger/20' 
                               : 'border-primary/20 focus:border-accent focus:ring-2 focus:ring-focus/50'" />
        </div>

        <div class="mt-2 flex items-center justify-end gap-2 text-xs text-primary/40">
            <span>Or try example:</span>

            <button type="button" x-ref="example_1ehz" hx-post="/upload/example/1ehz" hx-target="#upload-container"
                hx-swap="innerHTML" hx-include="[name='selected_model']" hx-indicator="#loading-spinner"
                @click="$event.stopPropagation(); if(!selectedModel) {pendingExample = 'example_1ehz'; dropdownOpen=true; return; }"
                class="font-medium hover:text-accent hover:underline decoration-dashed underline-offset-2 transition-colors cursor-pointer">
                1EHZ
            </button>
            <span class="select-none">•</span>

            <button type="button" x-ref="example_1mnx" hx-post="/upload/example/1mnx" hx-target="#upload-container"
                hx-swap="innerHTML" hx-include="[name='selected_model']" hx-indicator="#loading-spinner"
                @click="$event.stopPropagation(); if(!selectedModel) { pendingExample = 'example_1mnx'; dropdownOpen=true; return; }"
                class="font-medium hover:text-accent hover:underline decoration-dashed underline-offset-2 transition-colors cursor-pointer">
                1MNX
            </button>
            <span class="select-none">•</span>

            <button type="button" x-ref="example_2f8s" hx-post="/upload/example/2f8s" hx-target="#upload-container"
                hx-swap="innerHTML" hx-include="[name='selected_model']" hx-indicator="#loading-spinner"
                @click="$event.stopPropagation(); if(!selectedModel) { pendingExample = 'example_2f8s'; dropdownOpen=true; return; }"
                class="font-medium hover:text-accent hover:underline decoration-dashed underline-offset-2 transition-colors cursor-pointer">
                2F8S
            </button>
        </div>

        <p x-show="errors.file" x-transition class="mt-1 text-xs text-danger font-medium ml-1">
            Please upload a file or enter a PDB ID.
        </p>
    </div>
</div>
