<div x-data="modelCreator()" 
     @open-creator.window="showCreator = true"
     class="fixed inset-0 z-50 flex flex-col h-screen bg-white" 
     x-show="showCreator" 
     style="display: none;"
     x-transition>
    
    <div class="bg-white border-b border-tertiary-light px-6 py-4 flex justify-between items-center shadow-sm">
        <h2 class="text-xl font-bold text-secondary">Custom Model Creator</h2>
        <div class="flex gap-2">
             <button type="button" @click="downloadConfig()" class="mr-2 text-primary cursor-pointer hover:text-accent transition" title="Save to JSON">
                <i class="fa-solid fa-download text-lg"></i>
            </button>

            <button type="button" @click="showCreator = false" class="px-4 py-2 text-primary hover:bg-tertiary-light cursor-pointer rounded-lg transition">Cancel</button>
            <button type="button" @click="applyModel()" class="px-4 py-2 bg-primary cursor-pointer text-white font-semibold rounded-lg shadow-lg hover:shadow-accent-light transition">Use Model</button>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <div class="w-1/3 min-w-[400px] bg-white border-r border-tertiary-light overflow-y-auto p-6 space-y-6">
            
            <div>
                <label class="block text-sm font-medium text-primary mb-2">Model Name</label>
                <input type="text" x-model="modelName" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-focus outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-primary mb-2">Model Description</label>
                <input type="text" x-model="modelDescription" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-focus outline-none">
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-semibold text-primary">Beads Configuration</h3>
                    <button type="button" @click="addBead()" class="cursor-pointer text-accent text-sm font-medium hover:underline hover:underline-offset-2">+ Add Bead</button>
                </div>

                <template x-for="(bead, index) in beads" :key="index">
                    <div class="border border-tertiary-light rounded-xl p-4 bg-white relative group hover:border-primary/10 transition-colors">
                        <button type="button" @click="removeBead(index)" class="cursor-pointer absolute top-2 right-2 text-primary hover:text-danger">
                            <i class="fa-solid fa-times"></i>
                        </button>

                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="text-xs font-semibold text-primary uppercase">Bead Name</label>
                                <input type="text" x-model="bead.name" class="w-full text-sm border-b bg-transparent focus:border-accent outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-primary uppercase">Strategy</label>
                                <select x-model="bead.strategy" class="w-full text-sm bg-transparent border-b outline-none cursor-pointer">
                                    <option value="direct">Direct Mapping</option>
                                    <option value="geometric_center">Geometric Center</option>
                                    <option value="center_of_mass">Center of Mass</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                             <label class="text-xs font-semibold text-primary uppercase block mb-1">Apply to</label>
                             <template x-for="scope in avaiableScopes" :key="scope.value">
                                <button type="button" @click="bead.scope = scope.value" 
                                    :class="bead.scope === scope.value ? 'bg-secondary text-white' : 'bg-tertiary-light text-primary'" 
                                    class="hover:bg-accent-light cursor-pointer px-2 py-1 rounded transition-colors mr-1 mb-1 text-xs">
                                    <span x-text="scope.label"></span>
                                </button>
                                </template>
                        </div>

                        <div>
                            <label class="text-xs font-semibold text-primary uppercase block mb-2">Select Atoms</label>
                            <div class="flex flex-wrap gap-1.5">
                                <template x-for="atom in availableAtoms">
                                    <button 
                                        type="button"
                                        @click="toggleAtom(bead, atom)"
                                        class="cursor-pointer px-2 py-1 text-xs border rounded transition-colors select-none"
                                        :class="bead.atoms.includes(atom) ? 'bg-accent/10 border-accent text-accent font-bold' : 'bg-white border-tertiary-light text-primary hover:bg-accent-light' "
                                        x-text="atom">
                                    </button>
                                </template>
                            </div>
                            <p x-show="bead.strategy === 'direct' && bead.atoms.length > 1" class="text-xs text-danger mt-1 flex items-center gap-1">
                                <i class="fa-solid fa-triangle-exclamation"></i> Only first atom used.
                            </p>
                            <p x-show="bead.atoms.length === 0" class="text-xs text-danger mt-1">
                                Select at least one atom.
                            </p>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <div class="w-2/3 bg-white relative">            
            <div class="w-full h-full bg-white/90 backdrop-blur shadow-lg rounded-lg p-4 overflow-auto text-xs font-mono border border-tertiary-light opacity-80 hover:opacity-100 transition-opacity">
                <pre x-text="JSON.stringify(generateJson(), null, 2)"></pre>
            </div>
        </div>
    </div>
</div>
