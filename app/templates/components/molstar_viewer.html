{% macro molstar_viewer(container_id, urls=[], file_format= '', classes='') %}
<div id="{{ container_id }}" class="h-full w-full  {{ classes }}"></div>

<script type="text/javascript">
    molstar.Viewer.create('{{container_id}}', {
        layoutIsExpanded: false,
        layoutShowControls: false,
        layoutShowRemoteState: false,
        layoutShowSequence: true,
        layoutShowLog: true,
        layoutShowLeftPanel: true,

        viewportShowExpand: true,
        viewportShowSelectionMode: true,
        viewportShowAnimation: false,

        pdbProvider: 'rcsb',
        emdbProvider: 'rcsb',
    }).then(viewer => {
        const urlArray = {{ urls | tojson }};
        const fileFormatArray = {{ file_format | tojson }};

        let loadPromise = Promise.resolve();

        urlArray.forEach((url, index) => {
            const format = fileFormatArray[index];

            loadPromise = loadPromise.then(() => {
                return viewer.loadStructureFromUrl(url, format);
            });
        });

        loadPromise.then(() => {
            viewer.autoView();
        });
    });
</script>
{% endmacro %}
