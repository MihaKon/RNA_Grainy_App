{% macro molstar_viewer(container_id, file_data='', file_format= '', classes='') %}
<div id="{{ container_id }}" class="w-[320px] h-[240px] lg:w-[480px] lg:h-[320px] z-10 {{ classes }}"></div>

<script type="text/javascript">
        molstar.Viewer.create('{{container_id}}', {
        layoutIsExpanded: false,
        layoutShowControls: false,
        layoutShowRemoteState: false,
        layoutShowSequence: true,
        layoutShowLog: false,
        layoutShowLeftPanel: true,

        viewportShowExpand: true,
        viewportShowSelectionMode: false,
        viewportShowAnimation: false,

        pdbProvider: 'rcsb',
        emdbProvider: 'rcsb',
    }).then(viewer => {
        const fileData = {{ file_data | tojson }};
        const fileFormat = {{ file_format | tojson }};
        viewer.loadStructureFromData(fileData, fileFormat).then(() => {
            viewer.autoView();
        });
    });
</script>
{% endmacro %}
