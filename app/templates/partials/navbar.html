<nav x-data="{ 
        mobileOpen: false, 
        currentPath: window.location.pathname,
        isActive(path) {
            return this.currentPath === path || (path !== '/' && this.currentPath.startsWith(path));
        }
     }"
     class="sticky top-0 z-50 w-full bg-primary border-b border-white/10 transition-all duration-300">
  
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">
      
      <div class="flex flex-1 items-center justify-start gap-8">
        
        <a href="/" class="flex shrink-0 items-center gap-3 group outline-none">
            <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-white/5 border border-white/10 transition-all duration-300 group-hover:bg-accent group-hover:border-accent group-hover:shadow-lg group-hover:shadow-accent/20">
                <i class="fa-solid fa-dna fa-lg text-white transition-transform duration-500 group-hover:rotate-180 group-hover:text-white"></i>
            </div>
            <span class="text-white text-xl font-bold tracking-wider transition-colors duration-300 group-hover:text-accent">
                RNAgrainy
            </span>
        </a>

        <div class="hidden md:block ml-4">
          <div class="flex space-x-1">
            
            <a href="/" 
               class="px-3 py-2 rounded-lg text-sm font-medium transition-all duration-200 outline-none focus-visible:ring-2 focus-visible:ring-accent"
               :class="isActive('/') 
                    ? 'bg-white/10 text-white shadow-sm shadow-white/5' 
                    : 'text-gray-300 hover:bg-white/5 hover:text-white'">
              Home
            </a>

            <a href="/documentation" 
               class="px-3 py-2 rounded-lg text-sm font-medium transition-all duration-200 outline-none focus-visible:ring-2 focus-visible:ring-accent"
               :class="isActive('/documentation') 
                    ? 'bg-white/10 text-white shadow-sm shadow-white/5' 
                    : 'text-gray-300 hover:bg-white/5 hover:text-white'">
              Documentation
            </a>
            
            </div>
        </div>
      </div>

      <div class="absolute inset-y-0 right-0 flex items-center md:hidden">
        <button @click="mobileOpen = !mobileOpen" 
                type="button" 
                class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-white/10 hover:text-white"
                aria-controls="mobile-menu"
                :aria-expanded="mobileOpen.toString()">
          <span class="sr-only">Open main menu</span>
          
          <i class="fa-solid fa-bars fa-lg transition-all duration-200" 
             x-show="!mobileOpen" 
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-90"
             x-transition:enter-end="opacity-100 scale-100"></i>
          
          <i class="fa-solid fa-xmark fa-lg transition-all duration-200" 
             x-show="mobileOpen" 
             x-cloak
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-90 rotate-90"
             x-transition:enter-end="opacity-100 scale-100 rotate-0"></i>
        </button>
      </div>

    </div>
  </div>

  <div x-show="mobileOpen" 
       x-collapse 
       x-cloak
       class="md:hidden border-t border-white/10 bg-primary/95"
       id="mobile-menu">
    <div class="space-y-1 px-2 pb-4 pt-3">
      
      <a href="/" 
         class="block rounded-md px-3 py-2.5 text-base font-medium transition-colors outline-none"
         :class="isActive('/') 
            ? 'bg-accent text-white shadow-md shadow-accent/20' 
            : 'text-gray-300 hover:bg-white/10 hover:text-white'">
        Home
      </a>

      <a href="/documentation" 
         class="block rounded-md px-3 py-2.5 text-base font-medium transition-colors outline-none"
         :class="isActive('/documentation') 
            ? 'bg-accent text-white shadow-md shadow-accent/20' 
            : 'text-gray-300 hover:bg-white/10 hover:text-white'">
        Documentation
      </a>
      
    </div>
  </div>
</nav>
