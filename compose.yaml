services:
  app:
    build:
      context: .
    init: true
    restart: unless-stopped
    environment:
      WEB_CONCURRENCY: "3"
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - workspace-storage:/app/temp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cleaner:
    build:
      context: .
    init: true
    restart: unless-stopped
    command: [ "python", "-m", "app.services.workspaces.worker" ]
    volumes:
      - workspace-storage:/app/temp
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  workspace-storage:
