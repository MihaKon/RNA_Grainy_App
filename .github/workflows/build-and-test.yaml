name: Build and Test
on: [push, pull_request]
jobs:
  build-tailwind:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip css]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Install Node dependencies
        run: npm install
      - name: Build Tailwind CSS
        run: npm run dev
      - name: Check for CSS changes
        id: css-changes
        run: |
          if git diff --quiet app/static/css/ app/styles/; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit CSS changes
        if: steps.css-changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add app/static/css/ app/styles/
          git commit -m "🎨 Auto-build Tailwind CSS [skip css]" || exit 0
      - name: Push changes
        if: steps.css-changes.outputs.changes == 'true'
        run: git push
      - name: Upload CSS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-css
          path: |
            app/static/css/
            app/styles/
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: ruff
        run: pipenv run ruff check .
      - name: mypy
        run: pipenv run mypy .
  test:
    runs-on: ubuntu-latest
    needs: build-tailwind 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
            pip install pipenv
            pipenv install --dev
      - name: unit tests
        run: pipenv run pytest ./tests/unit/.
      - name: e2e tests
        run: pipenv run pytest ./tests/e2e/.