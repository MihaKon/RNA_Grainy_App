name: Build and Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  setup:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pipenv
          cache-dependency-path: Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install pipenv==2026.6.2

      - name: Install Python dependencies
        run: pipenv sync --dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/Pipfile.lock') }}

      - name: Install Playwright browsers and system dependencies
        run: pipenv run playwright install --with-deps chromium

      - name: Run Ruff
        run: pipenv run ruff check .

      - name: Run mypy
        run: pipenv run mypy .

      - name: Run unit tests
        run: pipenv run pytest tests/unit

      - name: Build Tailwind CSS
        run: npm run build

      - name: Run E2E tests
        run: pipenv run pytest tests/e2e

  docker:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: rnagrainy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run --detach --name rnagrainy-ci --publish 5050:5050 rnagrainy:ci

      - name: Check container health
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:5050/healthz; then
              exit 0
            fi
            sleep 2
          done

          docker logs rnagrainy-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force rnagrainy-ci || true
