[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]

disallow_untyped_defs = true
disallow_incomplete_defs = true

warn_unused_configs = true

show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config"
xfail_strict = true

[tool.djlint]
profile = "jinja"
max_line_length = 120
no_function_formatting = true
format_css = false
format_js = false
preserve_leading_space = true
